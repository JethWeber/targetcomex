services:

  # ─── Banco de Dados ───────────────────────────────────────────────────────
  target_comex_db:
    build: ./db-service
    container_name: target_comex_db
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TargetComex2025!
      - MSSQL_PID=Developer
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost",
            "-U", "sa", "-P", "TargetComex2025!", "-C",
            "-Q", "SELECT 1 FROM sys.databases WHERE name='TargetComex'",
            "-b"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ─── Canal de Recomendação (API) ─────────────────────────────────────────
  targetcomexcr:
    build: ./cr-service
    container_name: targetcomexcr
    ports:
      - "8000:8000"
    depends_on:
      target_comex_db:
        condition: service_healthy
    volumes:
      - ./cr-service:/app              # código fonte
      - models-data:/app/models        # embeddings persistentes
    environment:
      - DB_SERVER=target_comex_db
      - DB_PORT=1433
      - DB_DATABASE=TargetComex
      - DB_USERNAME=sa
      - DB_PASSWORD=TargetComex2025!
      - MODELS_DIR=/app/models
    restart: unless-stopped

  # ─── Watcher de Treino (detecta novos veículos e re-treina) ──────────────
  targetcomexcr-trainer:
    build: ./cr-service
    container_name: targetcomexcr_trainer
    command: python train.py --watch
    depends_on:
      target_comex_db:
        condition: service_healthy
    volumes:
      - ./cr-service:/app
      - models-data:/app/models        # mesmo volume da API
    environment:
      - DB_SERVER=target_comex_db
      - DB_PORT=1433
      - DB_DATABASE=TargetComex
      - DB_USERNAME=sa
      - DB_PASSWORD=TargetComex2025!
      - MODELS_DIR=/app/models
    restart: unless-stopped

  # ─── Backend ASP.NET Core ─────────────────────────────────────────────────
  target-api:
      build: ./target-api/Target.Api
      container_name: target_backend
      ports:
        - "5000:8080"
      depends_on:
        target_comex_db:
          condition: service_healthy
        targetcomexcr:
          condition: service_started
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_HTTP_PORTS=8080
        - ConnectionStrings__DefaultConnection=Server=target_comex_db;Database=TargetComex;User Id=sa;Password=TargetComex2025!;Encrypt=False;TrustServerCertificate=True;
        - AIServiceUrl=http://targetcomexcr:8000
      restart: unless-stopped

  # ─── Frontend Blazor ──────────────────────────────────────────────────────
  target-ui:
    build: ./target-ui/Target.Ui
    container_name: target_frontend
    ports:
      - "5001:8080"
    depends_on:
      - target-api
    volumes:
      - ./target-ui/keys:/app/DataProtection-Keys
    environment:
      - ApiServiceUrl=http://target-api:8080
      - ASPNETCORE_ENVIRONMENT=Development  
    restart: unless-stopped

volumes:
  db-data:
  models-data:    